services:
  stats-db:
    image: postgres:16.1
    container_name: postgres-ewm-stats-db
    ports:
      - "6543:5432"
    environment:
      POSTGRES_USER: postgres_stats
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ewm_stats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      timeout: 5s
      interval: 5s
      retries: 10

  ewm-db:
    image: postgres:16.1
    container_name: postgres-ewm-main-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres_main
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ewm_main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      timeout: 5s
      interval: 5s
      retries: 10

  db-init:
    image: postgres:16.1
    container_name: init-ewm-db
    depends_on:
      ewm-db:
        condition: service_healthy
    entrypoint: |
      bash -c '
      set -e
      until psql postgresql://postgres_main:postgres@ewm-db:5432/ewm_main -c "\q"; do
        echo "PostgreSQL is unavailable - sleeping"
        sleep 1
      done

      psql postgresql://postgres_main:postgres@ewm-db:5432/ewm_main -v ON_ERROR_STOP=1 <<EOSQL
      CREATE DATABASE ewm_category;
      CREATE DATABASE ewm_user;
      CREATE DATABASE ewm_request;
      CREATE DATABASE ewm_event;
      EOSQL
      '