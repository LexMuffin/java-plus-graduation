services:
  # ===================================================================
  # INFRASTRUCTURE SERVICES
  # ===================================================================
  discovery-server:
    build: infra/discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - ewm-network

  config-server:
    build: infra/config-server
    container_name: config-server
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 0
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    healthcheck:
      test: >
        curl -f http://discovery-server:8761/eureka/apps/CONFIG-SERVER |
        grep -q "<status>UP</status>"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - ewm-network

  gateway-server:
    build: infra/gateway-server
    container_name: gateway-server
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka/
      PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ewm-network

  # ===================================================================
  # DATABASES - отдельная БД для каждого сервиса
  # ===================================================================
  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: statsdb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
    networks:
      - ewm-network

  user-db:
    image: postgres:16.1
    container_name: user-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
    networks:
      - ewm-network

  category-db:
    image: postgres:16.1
    container_name: category-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: categorydb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
    networks:
      - ewm-network

  event-db:
    image: postgres:16.1
    container_name: event-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
    networks:
      - ewm-network

  request-db:
    image: postgres:16.1
    container_name: request-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: requestdb
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
    networks:
      - ewm-network

  # ===================================================================
  # BUSINESS LOGIC SERVICES
  # ===================================================================
  stats-service:
    build:
      context: ./stats/stats-server
      dockerfile: Dockerfile
    container_name: ewm-stats-service
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    environment:
      # DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/statsdb
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: 12345
      # Spring Cloud
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 9090
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_INSTANCE_ID: $${spring.cloud.client.ip-address}:$${spring.application.name}:$${server.port}
      # Spring Boot
      SPRING_APPLICATION_NAME: stats-service
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: >
        curl -s http://discovery-server:8761/eureka/apps/STATS-SERVICE |
        grep -q "<status>UP</status>"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ewm-network

  user-service:
    build:
      context: ./core/user-service
      dockerfile: Dockerfile
    container_name: ewm-user-service
    restart: unless-stopped
    ports:
      - "8081"
    depends_on:
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: 12345
      # Spring Cloud
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 0
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_INSTANCE_ID: $${spring.cloud.client.ip-address}:$${spring.application.name}:$${server.port}
      # Spring Boot
      SPRING_APPLICATION_NAME: user-service
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: >
        curl -s http://discovery-server:8761/eureka/apps/USER-SERVICE |
        grep -q "<status>UP</status>"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ewm-network

  category-service:
    build: core/category-service
    container_name: category-service
    restart: unless-stopped
    ports:
      - "8082"
    depends_on:
      category-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://category-db:5432/categorydb
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: 12345
      # Spring Cloud
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 0
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_INSTANCE_ID: $${spring.cloud.client.ip-address}:$${spring.application.name}:$${server.port}
      # Spring Boot
      SPRING_APPLICATION_NAME: category-service
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: >
        curl -s http://discovery-server:8761/eureka/apps/CATEGORY-SERVICE |
        grep -q "<status>UP</status>"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ewm-network

  event-service:
    build:
      context: ./core/event-service
      dockerfile: Dockerfile
    container_name: ewm-event-service
    restart: unless-stopped
    ports:
      - "8083"
    depends_on:
      event-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/eventdb
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: 12345
      # Spring Cloud
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 0
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_INSTANCE_ID: $${spring.cloud.client.ip-address}:$${spring.application.name}:$${server.port}
      # Spring Boot
      SPRING_APPLICATION_NAME: event-service
      SPRING_PROFILES_ACTIVE: docker
      # Ссылки на другие сервисы
      USER_SERVICE_URL: http://user-service
      CATEGORY_SERVICE_URL: http://category-service
    healthcheck:
      test: >
        curl -s http://discovery-server:8761/eureka/apps/EVENT-SERVICE |
        grep -q "<status>UP</status>"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ewm-network

  request-service:
    build:
      context: ./core/request-service
      dockerfile: Dockerfile
    container_name: ewm-request-service
    restart: unless-stopped
    ports:
      - "8084"
    depends_on:
      request-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      # DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://request-db:5432/request-db
      SPRING_DATASOURCE_USERNAME: request_user
      SPRING_DATASOURCE_PASSWORD: request_pass
      # Spring Cloud
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 0
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_INSTANCE_ID: $${spring.cloud.client.ip-address}:$${spring.application.name}:$${server.port}
      # Spring Boot
      SPRING_APPLICATION_NAME: request-service
      SPRING_PROFILES_ACTIVE: docker
      # Ссылки на другие сервисы
      USER_SERVICE_URL: http://user-service
      EVENT_SERVICE_URL: http://event-service
    healthcheck:
      test: >
        curl -s http://discovery-server:8761/eureka/apps/REQUEST-SERVICE |
        grep -q "<status>UP</status>"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ewm-network

# ===================================================================
# VOLUMES
# ===================================================================
volumes:
  stats-db-data:
  user-db-data:
  category-db-data:
  event-db-data:
  request-db-data:

# ===================================================================
# NETWORKS
# ===================================================================
networks:
  ewm-network:
    driver: bridge