server:
  port: 9090

spring:
  datasource:
    url: jdbc:postgresql://localhost:6543/ewm_stats
    username: postgres_stats
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      hibernate.format_sql: true
      dialect: org.hibernate.dialect.PostgreSQLDialect

